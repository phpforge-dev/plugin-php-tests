[package]
name = "phpforge-php-tests"
version = "1.0.0"
edition = "2021"
license = "MIT"
[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
tokio = {version="1",features=["full"]}
url = "2"
regex = "1"
tempfile = "3"
uuid = {version="1",features=["v4"]}
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
